name: Tikrinimas ir publikavimas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: HTML patikra
        run: npx --yes html-validate@9 "**/*.html"
      - name: Kiekviena užduotis įtraukta į pradinį puslapį
        run: |
          missing=0
          for dir in */; do
            dir=${dir%/}
            [ -f "$dir/index.html" ] || continue
            if ! grep -q "href=\"$dir/" index.html; then
              echo "::error file=index.html::Trūksta nuorodos į $dir/"
              missing=1
            fi
          done
          exit $missing

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Paruošiami failai
        run: |
          mkdir _site
          rsync -a --exclude '.git*' --exclude '.htmlvalidate.json' --exclude 'README.md' --exclude 'LICENSE' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
