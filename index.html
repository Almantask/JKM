<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JKM užduotys</title>
<style>
  :root { --bg: #f6f4ef; --surface: #ffffff; --ink: #1f2328; --muted: #5f6670; --line: #d9d4c9; --accent: #2f6fdb; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #17191c; --surface: #212429; --ink: #eceff3; --muted: #a3aab4; --line: #3a3f46; }
  }
  :root[data-theme="dark"] { --bg: #17191c; --surface: #212429; --ink: #eceff3; --muted: #a3aab4; --line: #3a3f46; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: clamp(26px, 4vw, 36px); }
  p { margin: 0 0 20px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a {
    display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; color: var(--ink); text-decoration: none;
  }
  a:hover { border-color: var(--accent); }
  a small { display: block; color: var(--muted); font-size: 14px; }
  a b { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>JKM užduotys</h1>
  <p>Interaktyvios pamokų užduotys</p>
  <ul>
    <li>
      <a href="02-rezultatas-ar-augimas/">
        <small>2 tema · Poroje · 10 min</small>
        <b>Rezultatas ar augimas?</b> – išdėliokite 20 kortelių: dešinėn rezultatas, aukštyn augimas
      </a>
    </li>
  </ul>
</main>
</body>
</html>
